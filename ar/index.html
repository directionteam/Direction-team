<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction Team AR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <div id="startScreen" class="screen">
        <div class="start-content">
            <h1>Direction Team</h1>
            <h2>🥽 تجربة الواقع المعزز</h2>
            <p>ركّب النظام الشمسي بيدك</p>
            <input type="text" id="playerName" placeholder="اكتب اسمك" maxlength="20">
            <button onclick="startGame()" class="start-btn">🚀 ابدأ</button>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden">
        <video id="video" autoplay playsinline></video>
        <canvas id="handCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
        <div class="hud">
            <div class="hud-top">
                <div class="hud-item"><span>👤</span><span id="hudPlayer">Player</span></div>
                <div class="hud-item"><span>⏱️</span><span id="hudTimer">0.0s</span></div>
                <div class="hud-item"><span>❌</span><span id="hudMistakes">0</span></div>
            </div>
            <div class="hud-next">التالي: <span id="hudNext">3</span></div>
        </div>
        <div id="endScreen" class="end-screen hidden">
            <h1>🎉 SYSTEM ONLINE!</h1>
            <p id="endStats"></p>
            <button onclick="restartGame()">🔄 إعادة</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
